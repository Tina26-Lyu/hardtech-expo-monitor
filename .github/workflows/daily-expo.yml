name: 每周硬科技展会监控

on:
  # 每周一北京时间 09:00 定时触发（UTC 01:00，周一）
  schedule:
    - cron: '0 1 * * 1'
  # 支持手动触发（用于测试）
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: 检出仓库代码
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: 设置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安装依赖
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 设置时区为北京时间
      - name: 设置时区
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          echo "当前时间: $(date '+%Y-%m-%d %H:%M:%S %Z')"

      # 5. 执行主程序
      - name: 运行展会监控
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
          EVENTBRITE_API_KEY: ${{ secrets.EVENTBRITE_API_KEY }}
        run: |
          python main.py

      # 6. 上传运行日志（便于排查）
      - name: 上传日志文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-monitor-log
          path: |
            *.log
          retention-days: 7
          if-no-files-found: ignore
